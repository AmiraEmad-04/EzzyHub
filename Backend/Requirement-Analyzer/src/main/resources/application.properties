# ============================================================
# EzzyHub Requirement Analyzer — application.properties v2
# ============================================================

spring.application.name=requirement-analyzer
server.port=8081

# ── DEV / PROD mode ──────────────────────────────────────────
# Set to false in production — enables security filter, hides Swagger
server.dev-mode=true

# ── MySQL ─────────────────────────────────────────────────────
# Override with env vars in production (never commit passwords)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ezzyhub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Groq AI API ───────────────────────────────────────────────
groq.api.key=${GROQ_API_KEY:}
groq.api.model=llama-3.1-8b-instant

# ── HF Inference API (alternative to Groq) ───────────────────
# Get free token: https://huggingface.co/settings/tokens
hf.token=${HF_TOKEN:}
# Set to true to use HF Inference API instead of Groq for AI validation
use.hf.validator=${USE_HF_VALIDATOR:false}

# ── Python NLP service ────────────────────────────────────────
python.nlp.base-url=${PYTHON_NLP_URL:http://localhost:8000}
# Service key — must match NLP_SERVICE_KEY in python .env (production only)
nlp.service.key=${NLP_SERVICE_KEY:}

# ── Code Analyzer service ─────────────────────────────────────
# FIX: port 8082 (not 8080)
code.analyzer.base-url=${CODE_ANALYZER_URL:http://localhost:8082}

# ── Matching ──────────────────────────────────────────────────
matching.jaccard.weight=0.35
matching.cosine.weight=0.65
matching.threshold.implemented=0.80
matching.threshold.partial=0.40
# Cross-encoder re-ranking (Hugging Face)
matching.rerank.enabled=true
matching.rerank.top-k=10
# Parallel embedding threads
feature.embed.threads=8

# ── Security filter ───────────────────────────────────────────
# Enable in production: set to true and set GATEWAY_SECRET env var
security.enabled=${SECURITY_ENABLED:false}
security.gateway-secret=${GATEWAY_SECRET:}
security.rate-limit.requests-per-minute=200

# ── Multipart ─────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Swagger ───────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Logging ───────────────────────────────────────────────────
logging.level.com.ezzyhub=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ── Jackson ───────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
