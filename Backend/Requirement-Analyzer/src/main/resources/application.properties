# =========================================
# EzzyHub Requirement Analyzer - Config
# =========================================

spring.application.name=requirement-analyzer
server.port=8081

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/ezzyhub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- AI provider selection ----
# Which LLM backend powers semantic validation (Phase 1, Step 3). Supported: groq, openai.
# Defaults to groq — unset behaves exactly as before this option existed.
ai.provider=${AI_PROVIDER:groq}

# ---- groq AI API (used when ai.provider=groq, the default) ----
# API key is provided via the GROQ_API_KEY environment variable — never hardcode it here.
#   bash:       export GROQ_API_KEY=gsk_...
#   PowerShell: $env:GROQ_API_KEY = "gsk_..."
groq.api.key=${GROQ_API_KEY:}
groq.api.model=${GROQ_API_MODEL:llama-3.1-8b-instant}

# ---- OpenAI API (used only when ai.provider=openai) ----
openai.api.key=${OPENAI_API_KEY:}
openai.api.model=${OPENAI_API_MODEL:gpt-4o-mini}

# ---- Shared JWT secret ----
# MUST be the exact same value as auth-service's and report-service's
# auth.jwt.secret — this is how this service verifies a token was really
# signed by auth-service, rather than trusting an unauthenticated request.
# SECURITY: the default below is fine for local development only — set the
# AUTH_JWT_SECRET environment variable to a long random string in any real
# deployment, and make sure all services use the same value.
auth.jwt.secret=${AUTH_JWT_SECRET:ezzyhub-local-dev-secret-change-me-before-deploying-anywhere-real}

# ---- NLP Settings ----
nlp.min-word-count=5
nlp.auto-id-prefix=REQ-AUTO

# ---- Embedding Model ----
embedding.model.enabled=false

# ---- Logging ----
logging.level.com.ezzyhub=INFO
logging.level.org.springframework.web.reactive=INFO
logging.level.org.springframework.web=WARN

# FIX NOTE-1: Serialize all date/time types as ISO-8601 strings, not epoch numbers.
# This makes MatchReport.timestamp readable (e.g. "2026-05-17T03:12:45Z") in JSON.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.datatype.jsr310.enabled=true
# ---- Swagger UI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha



# =========================================
# Integration: Code Analyzer client
# =========================================
# URL of your teammate's code-analyzer service
code.analyzer.base-url=${CODE_ANALYZER_BASE_URL:http://localhost:8080}

# Python NLP microservice (already existed, shown for clarity)
python.nlp.base-url=http://localhost:8000

# Matching stage config
matching.jaccard.weight=0.35
matching.cosine.weight=0.65
matching.threshold.implemented=0.80
matching.threshold.partial=0.40

# Multipart — allow large ZIP files for the /match endpoint
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
