server.port=8086
server.servlet.context-path=/

spring.application.name=report-service

# NEW: was H2 in a separate file (./data/reportdb), completely disconnected
# from the ezzyhub_db MySQL instance auth-service and requirement-analyzer
# already use — that's why saved reports never showed up there. Same
# database, same credentials as those two services now; this just adds its
# own table (verification_reports) to it.
# Override with env vars in production (never commit passwords) — same
# convention and same env var names as requirement-analyzer/auth-service,
# since all three point at the same MySQL instance/schema.
# zeroDateTimeBehavior=convertToNull: some legacy rows in verification_reports have a
# MySQL "zero date" (0000-00-00) in the old generated_at column (they were inserted
# before generated_at was populated, under a non-strict sql_mode). Without this flag the
# MySQL driver throws "Zero date value prohibited" when reading such a row, which broke the
# History list. Reading a zero date as NULL instead is harmless (generated_at is a legacy
# timestamp, not used in any logic) and keeps the list working for old data.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ezzyhub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Allow large JSON payloads (full analysis results can be big)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.mvc.async.request-timeout=120000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.ezzyhub.report=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# ---- Shared JWT secret ----
# MUST be the exact same value as auth-service's auth.jwt.secret — this is
# how report-service verifies a token was really signed by auth-service,
# rather than trusting a client-supplied header at face value.
# SECURITY: the default below is fine for local development only — set the
# AUTH_JWT_SECRET environment variable to a long random string in any real
# deployment, and make sure both services use the same value.
auth.jwt.secret=${AUTH_JWT_SECRET:ezzyhub-local-dev-secret-change-me-before-deploying-anywhere-real}
