# Test configuration: use an in-memory H2 database instead of the MySQL used in
# production, and override the forced MySQLDialect so Hibernate targets H2. A dummy
# JWT secret is provided so any bean that reads auth.jwt.secret can be created.
spring.datasource.url=jdbc:h2:mem:reporttest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

auth.jwt.secret=test-jwt-secret-that-is-at-least-32-bytes-long-000000
