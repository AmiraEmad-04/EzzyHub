# =========================================
# EzzyHub Auth Service - Config
# =========================================

spring.application.name=auth-service
server.port=8087

# ---- MySQL ----
# Same database instance and schema as requirement-analyzer (ezzyhub_db).
# This service just adds its own `users` table to it — no separate DB to
# stand up. spring.jpa.hibernate.ddl-auto=update creates/updates the table
# automatically on startup.
# Override with env vars in production (never commit passwords) — same
# convention and same env var names as requirement-analyzer, since both
# point at the same MySQL instance/schema.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ezzyhub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# SECURITY: this default secret is fine for local development only.
# In any shared or deployed environment, set the AUTH_JWT_SECRET environment
# variable to a long random string instead (same pattern as GROQ_API_KEY in
# requirement-analyzer's application.properties):
#   export AUTH_JWT_SECRET=$(openssl rand -base64 48)
auth.jwt.secret=${AUTH_JWT_SECRET:ezzyhub-local-dev-secret-change-me-before-deploying-anywhere-real}
# 7 days, in milliseconds
auth.jwt.expiration-ms=604800000

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.datatype.jsr310.enabled=true

# ---- Swagger UI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---- Logging ----
logging.level.com.ezzyhub.authservice=INFO
logging.level.org.springframework.web=WARN
