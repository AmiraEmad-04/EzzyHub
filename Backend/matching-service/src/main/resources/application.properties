# =========================================
# EzzyHub Matching Service — Config
# FR-7: Requirement-to-Code Matching
# Port: 8083
# =========================================

spring.application.name=matching-service
server.port=8083

# =========================================
# Multipart — allow large ZIP files
# =========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# =========================================
# Integration: Python NLP Microservice
# =========================================
# Endpoints used:
#   POST /ast-chunk-zip          → code chunking + embedding
#   POST /preprocess-and-embed   → requirement embedding
#   GET  /health                 → readiness check
python.nlp.base-url=http://localhost:8000

# AST chunking of large projects can take time — generous timeout
python.nlp.timeout-seconds=180

# =========================================
# Integration: Requirement Analyzer
# =========================================
# Used to fetch stored requirements when none are provided in the match request
# Endpoint: GET /api/v1/requirements
requirement.analyzer.base-url=http://localhost:8081
# ZERO-VECTOR FIX: raised from 30s to 300s. The matching-service calls
# Requirement-Analyzer's /analyze/batch, which embeds every requirement through
# Python. On a cold start the first embed can take minutes while the SBERT model
# loads, and we now RETRY transient failures (up to 3×) rather than returning a
# zero vector. A 30s ceiling here cut that off mid-batch and forced half the
# requirements to fall back to zero embeddings. 300s lets the batch finish.
requirement.analyzer.timeout-seconds=300

# =========================================
# Matching Algorithm (FR-7)
# =========================================

# Combined score = cosine.weight × cosine + jaccard.weight × jaccard
# Must sum to 1.0 for meaningful interpretation (not enforced, but recommended)
matching.cosine.weight=0.65
matching.jaccard.weight=0.35
matching.margin.implemented=0.0
matching.margin.partial=0.0

# FR-7.2.1 Classification thresholds
matching.threshold.implemented=0.44
matching.threshold.partial=0.39

# =========================================
# Readiness gate (STEP 0) — retry-then-block
# =========================================
# Before running a match, probe Python /health this many times. A cold service
# may still be loading models, so we retry rather than fail instantly. If it's
# still not ready after all attempts, the match is rejected with HTTP 503
# (instead of silently producing a zero-vector report full of false-MISSINGs).
matching.readiness.max-attempts=5
matching.readiness.delay-seconds=3

# How many top-matching chunks to include per requirement in the report (FR-10.1)
matching.top-k-chunks=200

# =========================================
# Swagger / OpenAPI
# =========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# =========================================
# Jackson
# =========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.datatype.jsr310.enabled=true

# =========================================
# CORS (see CorsConfig)
# =========================================
# Comma-separated list of allowed origins. Default "*" is safe here because the
# API is credential-less (allowCredentials=false). Lock this down to the real
# frontend origin(s) in production, e.g. cors.allowed-origins=https://app.example.com
cors.allowed-origins=*

# =========================================
# Input limits (resource-exhaustion / LLM09 unbounded consumption)
# =========================================
# Upper bounds on the inline requirements payload. These bound how many
# downstream embedding/LLM calls a single request can trigger. Generous
# defaults so normal use is unaffected; abusive payloads are rejected.
matching.limits.max-requirements=2000
matching.limits.max-requirements-json-chars=1000000

# =========================================
# Logging
# =========================================
# SECURITY (OWASP A09): default to INFO so requirement text and code snippets
# are not written to logs at DEBUG. Raise to DEBUG only in a trusted dev profile.
logging.level.com.ezzyhub=INFO
logging.level.org.springframework.web.reactive=WARN
logging.level.org.springframework.web=WARN
logging.level.io.netty=WARN
