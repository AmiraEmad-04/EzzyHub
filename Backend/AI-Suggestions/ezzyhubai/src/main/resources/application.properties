# ---- Shared MySQL database (ezzyhub_db) ----
# Same instance/schema/credentials as auth-service, report-service, and
# Requirement-Analyzer — the whole platform now uses one database.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ezzyhub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=${SERVER_PORT:8088}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
openai.api.key=${OPENAI_API_KEY:}

# ---- Shared JWT secret ----
# MUST be the exact same value as auth-service's/report-service's/
# requirement-analyzer's auth.jwt.secret — this is how this service verifies
# a token was really signed by auth-service, rather than trusting an
# unauthenticated request.
# SECURITY: the default below is fine for local development only — set the
# AUTH_JWT_SECRET environment variable to a long random string in any real
# deployment, and make sure all services use the same value.
auth.jwt.secret=${AUTH_JWT_SECRET:ezzyhub-local-dev-secret-change-me-before-deploying-anywhere-real}

# ---- CORS ----
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ---- Concurrency cap for /from-match (one OpenAI call per requirement) ----
ai.max-concurrent-generations=${AI_MAX_CONCURRENT_GENERATIONS:3}

# ---- ZIP extraction guard ----
zip.max-entries=${ZIP_MAX_ENTRIES:20000}

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never