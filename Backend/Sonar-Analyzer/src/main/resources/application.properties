# NEW: was 8080, which collided with code-analyzer (also 8080). Moved to
# 8084 — the only port in the 8080-8087 range nothing else in the platform
# uses (8000 python-nlp, 8080 code-analyzer, 8081 requirement-analyzer,
# 8084 matching-service, 8085 gateway, 8086 report-service, 8087 auth-service).
server.port=8084

# SonarQube Configuration
# Must be a User Token, not a Project/Global Analysis Token — analysis tokens are
# scoped by SonarQube to only "provisioning"+"scan" and get "Insufficient privileges"
# on the read-side APIs this service calls after scanning (/api/ce/component,
# /api/issues/search, /api/measures/component, /api/qualitygates/project_status).
# waitForAnalysis() silently swallows that error per-attempt and retries, so with an
# analysis token every scan looked like it hung and failed with a timeout after 5
# minutes even though SonarQube had already finished processing the report.
sonar.host.url=http://localhost:9000
sonar.token=squ_0bfe322dd9967a9e6ce437d0407faca73fa78af0

# File Upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# CORS
cors.allowed.origins=http://localhost:3000,http://localhost:5173

# Temp directory for extracted projects
# Uses the OS temp dir so it works on both Windows and Linux/Mac
app.temp.dir=${java.io.tmpdir}/sonar-projects
