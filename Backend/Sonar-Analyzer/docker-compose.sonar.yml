version: "3.8"

services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  db:
    image: postgres:15
    container_name: sonar_postgres
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data

  # Spring Boot backend analyzer
  sonar-analyzer:
    build: .
    container_name: sonar-analyzer
    depends_on:
      - sonarqube
    ports:
      - "8084:8084"
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      # User Token (not a Project/Global Analysis Token) — see the comment in
      # application.properties for why analysis tokens break this service.
      SONAR_TOKEN: squ_0bfe322dd9967a9e6ce437d0407faca73fa78af0
    volumes:
      - sonar_projects:/tmp/sonar-projects

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  postgresql_data:
  sonar_projects:
