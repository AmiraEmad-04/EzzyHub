# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=code-analyzer

# Multipart File Upload - support large ZIP files
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics
# "never" avoids leaking internal health details (disk space, component internals, etc.)
# to unauthenticated callers; the app's own /api/v1/health endpoint is unaffected.
management.endpoint.health.show-details=never

# Logging
logging.level.com.codeanalyzer=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Async thread pool
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100