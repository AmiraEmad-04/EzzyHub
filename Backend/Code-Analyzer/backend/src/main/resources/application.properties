# ── Server ────────────────────────────────────────────────────────────────────
# FIX: Port changed from 8080 → 8082 to match what the Requirement Analyzer
#      and the frontend both expect (code.analyzer.base-url=http://localhost:8082).
server.port=8082
server.servlet.context-path=/

spring.application.name=code-analyzer

# ── Multipart — support up to 1 GB ZIP files ─────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.codeanalyzer=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── SpringDoc / Swagger ───────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ── Async thread pool ─────────────────────────────────────────────────────────
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
