version: '3.8'

services:

  # ── Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: code-analyzer-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - SERVER_PORT=8080
    volumes:
      - /tmp/code-analyzer:/tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ── Frontend (served by Nginx) ────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: code-analyzer-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: code-analyzer-network
